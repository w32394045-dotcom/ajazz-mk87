name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# 同一分支的旧 push run 自动取消（tag / 手动 dispatch 不取消，避免发布或验证被中断）
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type != 'tag' }}

jobs:
  # ---------------------------------------------------------------- 测试（每次 push 都跑，约 1-2 分钟）
  test:
    name: offline tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: driver/packaging/requirements.txt
      - name: Install dependencies
        working-directory: driver
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements.txt
      - name: Run offline unit tests
        working-directory: driver
        shell: bash
        run: python -m unittest discover -s tests -v

  # ---------------------------------------------------------------- 打包（只在 tag / 手动触发时跑）
  # 2026-11-05 用户要求：main 的每次 push 不再构建安装包，只跑测试；
  # deb / rpm 拆到两台不同 runner 并行，tag 发布总等待时间从 ~8.5 分钟降到 ~6-7 分钟。
  #
  # ⚠ 2026-11-05 闪退回归根因：GitHub 的 `ubuntu-latest` 在 11-03→11-04 之间从 24.04 切到了
  # 26.04（glibc 2.43）。PyInstaller 会把构建机上的系统库（libglib 等）打进包，结果 v0.1.7/
  # v0.1.8 的包在 Ubuntu 24.04（glibc 2.39）上加载时直接报
  # `GLIBC_2.43 not found` → PyQt6 导入失败 → 启动闪退。v0.1.6（构建于 ubuntu-24.04）正常。
  # 修复：Linux 包固定在 **ubuntu-22.04**（glibc 2.35）构建，兼容 22.04 及更新版本。
  linux-deb:
    name: linux deb (Debian/Ubuntu)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: driver/packaging/requirements.txt
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libudev-dev
      - name: Python dependencies
        working-directory: driver
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements.txt pyinstaller
      - name: Build PyInstaller app
        working-directory: driver
        run: python -m PyInstaller packaging/mk87.spec --noconfirm --clean
      - name: Build .deb
        working-directory: driver
        run: bash packaging/linux/build-deb.sh
      # 2026-11-05 用户 Ubuntu 闪退：PyQt6 在打包程序里导入失败（缺系统库）。
      # 这里在**干净的 Ubuntu 24.04 容器**里按 deb 自己声明的 Depends 安装后启动打包程序，
      # app 被 timeout 杀掉（exit=124）= 一直活着 = 启动成功；否则阻塞发布。
      - name: Runtime check in clean Ubuntu 22.04 + 24.04 containers
        working-directory: driver
        run: |
          for IMG in ubuntu:22.04 ubuntu:24.04; do
            echo "===================== $IMG ====================="
            docker run --rm -v "$PWD/dist-packages:/pkg:ro" "$IMG" bash -euc '
              apt-get update -qq
              DEB=$(ls /pkg/*.deb | head -1)
              apt-get install -y -qq --no-install-recommends xvfb ca-certificates dpkg > /dev/null
              # 真实安装流程解析 Depends（含 `a | b` 备选、t64 重命名），等价于用户
              # `sudo apt install ./mk87_*.deb`；装不齐依赖这里会直接失败。
              dpkg -i "$DEB" || true
              apt-get -f install -y -qq > /dev/null
              dpkg -s mk87 > /dev/null
              export QT_QPA_PLATFORM=xcb
              export QTWEBENGINE_CHROMIUM_FLAGS="--disable-gpu --no-sandbox --disable-dev-shm-usage"
              code=0
              timeout 40 xvfb-run -a /opt/mk87/MK87Config --tray > /tmp/app.log 2>&1 || code=$?
              echo "app_exit_code=$code"
              tail -100 /tmp/app.log || true
              cat "$HOME/.mk87-boot.log" 2>/dev/null || true
              if [ "$code" = "124" ]; then echo "OK: app stayed alive 40s"; exit 0; fi
              echo "FAIL: app exited early"; exit 1
            '
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: driver/dist-packages/*.deb
          if-no-files-found: error

  linux-rpm:
    name: linux rpm (Fedora/RHEL/openSUSE)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: driver/packaging/requirements.txt
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libudev-dev
      - name: Python dependencies
        working-directory: driver
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements.txt pyinstaller
      - name: Build PyInstaller app
        working-directory: driver
        run: python -m PyInstaller packaging/mk87.spec --noconfirm --clean
      - name: Build .rpm
        working-directory: driver
        run: bash packaging/linux/build-rpm.sh
      # 同上：在干净的 Fedora 容器里 dnf 安装 rpm（会解析 Requires）后启动，验证依赖声明
      # 和自包含库都正确，防止「Ubuntu 能跑、Fedora 缺库」这类问题再次发出去。
      - name: Runtime check in clean Fedora container
        working-directory: driver
        run: |
          docker run --rm -v "$PWD/dist-packages:/pkg:ro" fedora:latest bash -euc '
            RPM=$(ls /pkg/*.rpm | head -1)
            dnf install -y -q "$RPM" xorg-x11-server-Xvfb > /dev/null
            export QT_QPA_PLATFORM=xcb
            export QTWEBENGINE_CHROMIUM_FLAGS="--disable-gpu --no-sandbox --disable-dev-shm-usage"
            code=0
            timeout 40 xvfb-run -a /opt/mk87/MK87Config --tray > /tmp/app.log 2>&1 || code=$?
            echo "app_exit_code=$code"
            tail -100 /tmp/app.log || true
            cat "$HOME/.mk87-boot.log" 2>/dev/null || true
            if [ "$code" = "124" ]; then echo "OK: app stayed alive 40s"; exit 0; fi
            echo "FAIL: app exited early"; exit 1
          '
      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: driver/dist-packages/*.rpm
          if-no-files-found: error

  windows-package:
    name: windows portable + installer
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: driver/packaging/requirements.txt
      - name: Python dependencies
        working-directory: driver
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements.txt pyinstaller
      - name: Build portable zip
        working-directory: driver
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build-portable.ps1
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        working-directory: driver
        shell: powershell
        continue-on-error: true
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build-installer.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-package
          path: |
            driver/dist-packages/*.zip
            driver/dist-installer/*.exe
          if-no-files-found: warn

  # 打 v* tag 时自动发布 GitHub Release（附件 = 全部安装包 + SHA256SUMS.txt）
  release:
    name: publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, linux-deb, linux-rpm, windows-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files + checksums
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp -v {} release-files/ \;
          cd release-files
          sha256sum * > SHA256SUMS.txt
          echo '--- release files ---'
          ls -lh
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "MK87 Studio ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: release-files/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
