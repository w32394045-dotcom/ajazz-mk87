name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# 同一分支的旧 run 自动取消（tag 不取消，避免发布中断）
concurrency:
  group: build-${{ github.ref }}${{ github.ref_type == 'tag' && '-release' || '' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # ---------------------------------------------------------------- 测试（每次 push 都跑，约 1-2 分钟）
  test:
    name: offline tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: driver/packaging/requirements.txt
      - name: Install dependencies
        working-directory: driver
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements.txt
      - name: Run offline unit tests
        working-directory: driver
        shell: bash
        run: python -m unittest discover -s tests -v

  # ---------------------------------------------------------------- 打包（只在 tag / 手动触发时跑）
  # 2026-11-05 用户要求：main 的每次 push 不再构建安装包，只跑测试；
  # deb / rpm 拆到两台不同 runner 并行，tag 发布总等待时间从 ~8.5 分钟降到 ~6-7 分钟。
  linux-deb:
    name: linux deb (Debian/Ubuntu)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: driver/packaging/requirements.txt
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libudev-dev
      - name: Python dependencies
        working-directory: driver
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements.txt pyinstaller
      - name: Build PyInstaller app
        working-directory: driver
        run: python -m PyInstaller packaging/mk87.spec --noconfirm --clean
      - name: Build .deb
        working-directory: driver
        run: bash packaging/linux/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: driver/dist-packages/*.deb
          if-no-files-found: error

  linux-rpm:
    name: linux rpm (Fedora/RHEL/openSUSE)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: driver/packaging/requirements.txt
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libudev-dev
      - name: Python dependencies
        working-directory: driver
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements.txt pyinstaller
      - name: Build PyInstaller app
        working-directory: driver
        run: python -m PyInstaller packaging/mk87.spec --noconfirm --clean
      - name: Build .rpm
        working-directory: driver
        run: bash packaging/linux/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: driver/dist-packages/*.rpm
          if-no-files-found: error

  windows-package:
    name: windows portable + installer
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: driver/packaging/requirements.txt
      - name: Python dependencies
        working-directory: driver
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements.txt pyinstaller
      - name: Build portable zip
        working-directory: driver
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build-portable.ps1
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        working-directory: driver
        shell: powershell
        continue-on-error: true
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build-installer.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-package
          path: |
            driver/dist-packages/*.zip
            driver/dist-installer/*.exe
          if-no-files-found: warn

  # 打 v* tag 时自动发布 GitHub Release（附件 = 全部安装包 + SHA256SUMS.txt）
  release:
    name: publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, linux-deb, linux-rpm, windows-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files + checksums
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp -v {} release-files/ \;
          cd release-files
          sha256sum * > SHA256SUMS.txt
          echo '--- release files ---'
          ls -lh
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "MK87 Studio ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: release-files/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
