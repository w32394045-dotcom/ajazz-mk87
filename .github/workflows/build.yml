name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# 同一分支的旧 push run 自动取消（tag / 手动 dispatch 不取消，避免发布或验证被中断）
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type != 'tag' }}

jobs:
  # ---------------------------------------------------------------- 测试（每次 push 都跑，约 1-2 分钟）
  test:
    name: offline tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: driver/packaging/requirements.txt
      - name: Install dependencies
        working-directory: driver
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements.txt
      - name: Run offline unit tests
        working-directory: driver
        shell: bash
        run: python -m unittest discover -s tests -v

  # ---------------------------------------------------------------- 打包（只在 tag / 手动触发时跑）
  # 2026-11-05 用户要求：main 的每次 push 不再构建安装包，只跑测试；
  # deb / rpm 拆到两台不同 runner 并行，tag 发布总等待时间从 ~8.5 分钟降到 ~6-7 分钟。
  #
  # ⚠ 2026-11-05 闪退回归根因：GitHub 的 `ubuntu-latest` 在 11-03→11-04 之间从 24.04 切到了
  # 26.04（glibc 2.43）。PyInstaller 会把构建机上的系统库（libglib 等）打进包，结果 v0.1.7/
  # v0.1.8 的包在 Ubuntu 24.04（glibc 2.39）上加载时直接报
  # `GLIBC_2.43 not found` → PyQt6 导入失败 → 启动闪退。v0.1.6（构建于 ubuntu-24.04）正常。
  # 修复：Linux 包固定在 **ubuntu-22.04**（glibc 2.35）构建，兼容 22.04 及更新版本。
  #
  # ⚠ 2026-11-06 v0.1.8.2 在用户 Ubuntu 24.04 上仍闪退（这次是段错误）：因为 PyInstaller 还会
  # 顺着 Qt 库的 DT_NEEDED 把构建机的 glib/libstdc++/wayland/xcb 打进包，在 24.04 上顶掉
  # 系统 Mesa/GLib。修复：宿主系统库一律不随包（packaging/libfilter.py），deb/rpm 显式声明
  # 依赖，并在容器里做「ldd 缺库检查 + 启动存活 40s」双重卡口。
  linux-deb:
    name: linux deb (Debian/Ubuntu)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: driver/packaging/requirements.txt
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libudev-dev
      - name: Python dependencies
        working-directory: driver
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements.txt pyinstaller
      - name: Build PyInstaller app
        working-directory: driver
        run: python -m PyInstaller packaging/mk87.spec --noconfirm --clean
      # 2026-11-06（v0.1.8.3）打包策略卡口：宿主系统库（glib/libstdc++/wayland/xcb/Mesa
      # /NSS…）**不许**打进 _internal。v0.1.8.2 正是因为把构建机 Ubuntu 22.04 的系统库
      # 打进包，在用户 Ubuntu 24.04 上顶掉系统 Mesa/GLib → EGL 不可用 → QtWebEngine 段错误。
      # 规则实现：driver/packaging/libfilter.py；校验：driver/packaging/linux/check-bundle.sh。
      - name: Bundle policy check (host system libs must not be bundled)
        working-directory: driver
        run: |
          sh -n packaging/linux/mk87-launcher
          bash packaging/linux/check-bundle.sh
      - name: Build .deb
        working-directory: driver
        run: bash packaging/linux/build-deb.sh
      # 在干净的 Ubuntu 22.04 / 24.04 容器里按 deb 自己声明的 Depends 安装后验证：
      #   1) 打包体所有 ELF 的 DT_NEEDED 都能在本机解析（Depends 完整性）；
      #   2) 启动后能稳定存活 40s（被 timeout 杀掉 = exit 124），而不是崩溃退出。
      # 这两条正好覆盖 v0.1.8.2 用户遇到的「装完启动闪退 / 段错误」。
      - name: Runtime check in clean Ubuntu 22.04 + 24.04 containers
        working-directory: driver
        run: |
          for IMG in ubuntu:22.04 ubuntu:24.04; do
            echo "===================== $IMG ====================="
            docker run --rm -v "$PWD/dist-packages:/pkg:ro" "$IMG" bash -euc '
              apt-get update -qq
              DEB=$(ls /pkg/*.deb | head -1)
              apt-get install -y -qq --no-install-recommends xvfb ca-certificates dpkg \
                libgl1-mesa-dri libglx-mesa0 libegl-mesa0 > /dev/null
              # 等价于用户 `sudo apt install ./mk87_*.deb`：按 deb 声明的 Depends 解析安装。
              dpkg -i "$DEB" || true
              apt-get -f install -y -qq > /dev/null
              dpkg -s mk87 > /dev/null

              echo "----- 1) 依赖完整性（ldd 不许有 not found）-----"
              export LD_LIBRARY_PATH=/opt/mk87/_internal
              missing=$( (find /opt/mk87 -type f \( -name "*.so" -o -name "*.so.*" -o -name MK87Config \) -print0 \
                | xargs -0 -r ldd 2>/dev/null || true) | awk "/not found/{print \$1}" | sort -u)
              if [ -n "$missing" ]; then
                echo "FAIL: 打包体引用了本机没有的系统库（Depends 不完整）："
                echo "$missing"
                exit 1
              fi
              echo "OK: 所有共享库依赖都能解析"

              echo "----- 2) 启动（Xvfb + llvmpipe 软件 GL，真实走 Qt/WebEngine 初始化）-----"
              export QT_QPA_PLATFORM=xcb
              export LIBGL_ALWAYS_SOFTWARE=1
              export QTWEBENGINE_CHROMIUM_FLAGS="--no-sandbox --disable-dev-shm-usage"
              code=0
              timeout 40 xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX +render" \
                /opt/mk87/MK87Config --tray > /tmp/app.log 2>&1 || code=$?
              echo "app_exit_code=$code (124 = 稳定存活 40s)"
              tail -80 /tmp/app.log || true
              echo "----- boot log -----"
              cat "$HOME/.mk87-boot.log" 2>/dev/null || true
              if [ "$code" != "124" ]; then
                echo "FAIL: app 没有稳定运行 40s（exit=$code，崩溃/异常退出）"
                exit 1
              fi
              if ! grep -q "\[preflight-pyqt6-ok\]" "$HOME/.mk87-boot.log" 2>/dev/null; then
                echo "FAIL: PyQt6 预检没有通过"
                exit 1
              fi
              if ! grep -q "\[webview-start-begin\]" "$HOME/.mk87-boot.log" 2>/dev/null; then
                echo "FAIL: 没有进入 WebEngine 初始化阶段"
                exit 1
              fi
              echo "OK: app 稳定运行 40s，且已进入 WebEngine 初始化"
            '
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: driver/dist-packages/*.deb
          if-no-files-found: error

  linux-rpm:
    name: linux rpm (Fedora/RHEL/openSUSE)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: driver/packaging/requirements.txt
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libudev-dev
      - name: Python dependencies
        working-directory: driver
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements.txt pyinstaller
      - name: Build PyInstaller app
        working-directory: driver
        run: python -m PyInstaller packaging/mk87.spec --noconfirm --clean
      - name: Bundle policy check (host system libs must not be bundled)
        working-directory: driver
        run: bash packaging/linux/check-bundle.sh
      - name: Build .rpm
        working-directory: driver
        run: bash packaging/linux/build-rpm.sh
      # 同上：在干净的 Fedora 容器里 dnf 安装 rpm（会解析 Requires）后启动。
      # 已知问题（v0.1.8.2 记为 known issue，待处理）：PyInstaller 打包的 numpy
      # (libscipy_openblas64_*.so) 在较新 glibc 的 Fedora 容器里报
      # "ELF load command address/offset not page-aligned"；另 Fedora 包名与 Ubuntu
      # 不同，Requires 可能有个别名字需要调整。先记日志不阻塞发布（Ubuntu deb 的
      # 启动检查是阻塞的）。
      - name: Runtime check in clean Fedora container (informational)
        continue-on-error: true
        working-directory: driver
        run: |
          docker run --rm -v "$PWD/dist-packages:/pkg:ro" fedora:latest bash -euc '
            RPM=$(ls /pkg/*.rpm | head -1)
            dnf install -y -q "$RPM" xorg-x11-server-Xvfb mesa-dri-drivers > /dev/null
            echo "----- 依赖完整性（ldd 不许有 not found）-----"
            export LD_LIBRARY_PATH=/opt/mk87/_internal
            missing=$( (find /opt/mk87 -type f \( -name "*.so" -o -name "*.so.*" -o -name MK87Config \) -print0 \
              | xargs -0 -r ldd 2>/dev/null || true) | awk "/not found/{print \$1}" | sort -u)
            if [ -n "$missing" ]; then
              echo "FAIL: 缺少系统库："; echo "$missing"; exit 1
            fi
            echo "OK: 所有共享库依赖都能解析"
            export QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1
            export QTWEBENGINE_CHROMIUM_FLAGS="--no-sandbox --disable-dev-shm-usage"
            code=0
            timeout 40 xvfb-run -a /opt/mk87/MK87Config --tray > /tmp/app.log 2>&1 || code=$?
            echo "app_exit_code=$code"
            tail -100 /tmp/app.log || true
            cat "$HOME/.mk87-boot.log" 2>/dev/null || true
            if [ "$code" = "124" ]; then echo "OK: app stayed alive 40s"; exit 0; fi
            echo "FAIL: app exited early"; exit 1
          '
      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: driver/dist-packages/*.rpm
          if-no-files-found: error

  windows-package:
    name: windows portable + installer
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: driver/packaging/requirements.txt
      - name: Python dependencies
        working-directory: driver
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements.txt pyinstaller
      - name: Build portable zip
        working-directory: driver
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build-portable.ps1
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        working-directory: driver
        shell: powershell
        continue-on-error: true
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build-installer.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-package
          path: |
            driver/dist-packages/*.zip
            driver/dist-installer/*.exe
          if-no-files-found: warn

  # 打 v* tag 时自动发布 GitHub Release（附件 = 全部安装包 + SHA256SUMS.txt）
  release:
    name: publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, linux-deb, linux-rpm, windows-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files + checksums
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp -v {} release-files/ \;
          cd release-files
          sha256sum * > SHA256SUMS.txt
          echo '--- release files ---'
          ls -lh
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "MK87 Studio ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: release-files/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
