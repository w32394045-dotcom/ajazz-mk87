name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    name: offline tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: driver
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements.txt
      - name: Run offline unit tests
        working-directory: driver
        shell: bash
        run: python -m unittest discover -s tests -v

  linux-packages:
    name: linux deb + rpm
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev libudev-dev
      - name: Python dependencies
        working-directory: driver
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements.txt pyinstaller
      - name: Build .deb and .rpm
        working-directory: driver
        run: bash packaging/linux/make-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            driver/dist-packages/*.deb
            driver/dist-packages/*.rpm
          if-no-files-found: error

  windows-package:
    name: windows portable + installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependencies
        working-directory: driver
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements.txt pyinstaller
      - name: Build portable zip
        working-directory: driver
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build-portable.ps1
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        working-directory: driver
        shell: powershell
        continue-on-error: true
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build-installer.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-package
          path: |
            driver/dist-packages/*.zip
            driver/dist-installer/*.exe
          if-no-files-found: warn

  # 打 v* tag 时自动发布 GitHub Release（附件 = 全部安装包 + SHA256SUMS.txt）
  release:
    name: publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-packages, windows-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files + checksums
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp -v {} release-files/ \;
          cd release-files
          sha256sum * > SHA256SUMS.txt
          echo '--- release files ---'
          ls -lh
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "MK87 Studio ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: release-files/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
